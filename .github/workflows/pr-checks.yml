name: PR Checks

on:
  pull_request:
    branches: [dev]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install

      - name: Generate type declarations
        run: pnpm --filter @xbghc/gitcode-dashboard exec vite build --mode development

      - name: Build
        run: pnpm build

      - name: Test
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: pnpm --filter @xbghc/gitcode-api test

      - name: Type Check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint
