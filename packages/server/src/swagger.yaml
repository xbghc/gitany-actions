              schema:
                type: string
                description: SSE 事件流
        '404':
          description: Workflow 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflow/{workflowId}:
    get:
      tags:
        - Workflows
      summary: 查询 workflow 状态
      description: 获取指定 workflow 的执行状态和详细信息
      operationId: getWorkflowStatus
      parameters:
        - $ref: '#/components/parameters/WorkflowIdParam'
      responses:
        '200':
          description: 成功获取 workflow 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WorkflowResult'
        '404':
          description: Workflow 不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflows/{owner}/{repo}:
    get:
      tags:
        - Workflows
      summary: 列出仓库的所有 workflow 历史
      description: 获取指定仓库的所有 workflow 执行记录
      operationId: listWorkflows
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OwnerParam'
        - $ref: '#/components/parameters/RepoParam'
      responses:
        '200':
          description: 成功获取 workflow 列表
          content:
