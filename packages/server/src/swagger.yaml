  /api/workflow/pr/{number}:
    post:
      tags:
        - Workflows
      summary: 触发 PR 的 build 和 lint 测试
      description: 为指定的 Pull Request 触发 workflow 执行（build、lint 等）
      operationId: triggerPrWorkflow
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - name: number
          in: path
          required: true
          description: PR 编号
          schema:
            type: integer
          example: 42
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - owner
                - repo
              properties:
                owner:
                  type: string
                  description: 仓库所有者
                  example: 'username'
                repo:
                  type: string
                  description: 仓库名称
                  example: 'my-project'
                packageManager:
                  type: string
                  description: 包管理器
                  enum: [npm, pnpm, yarn]
                  example: 'pnpm'
                buildCommand:
                  type: string
                  description: 构建命令
                  example: 'pnpm build'
                lintCommand:
                  type: string
                  description: lint 命令
                  example: 'pnpm lint'
                baseImage:
                  type: string
                  description: Docker 基础镜像
                  example: 'node:22-bookworm'
                timeout:
                  type: number
                  description: 超时时间（毫秒）
                  example: 600000
      responses:
        '200':
          description: 成功启动 workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      workflowId:
                        type: string
                        example: 'workflow-ghi789'
                      status:
                        type: string
                        example: 'pending'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflow/{workflowId}/stream:
    get:
      tags:
        - Workflows
      summary: 通过 SSE 实时接收 workflow 输出
      description: 使用 Server-Sent Events (SSE) 实时推送 workflow 执行输出
      operationId: streamWorkflowOutput
      parameters:
        - $ref: '#/components/parameters/WorkflowIdParam'
      responses:
        '200':
          description: 成功建立 SSE 连接
          content:
