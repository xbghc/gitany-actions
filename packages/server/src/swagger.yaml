        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/container/{containerId}:
    get:
      tags:
        - Containers
      summary: 获取容器详情
      description: 根据容器 ID 获取容器的详细信息
      operationId: getContainer
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContainerIdParam'
      responses:
        '200':
          description: 成功获取容器详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      info:
                        $ref: '#/components/schemas/ContainerInfo'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 容器不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - Containers
      summary: 删除容器
      description: 删除指定的 Docker 容器
      operationId: deleteContainer
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ContainerIdParam'
      responses:
        '200':
          description: 成功删除容器
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
