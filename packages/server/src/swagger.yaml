        - $ref: '#/components/parameters/OwnerParam'
        - $ref: '#/components/parameters/RepoParam'
      responses:
        '200':
          description: 成功获取容器列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      containers:
                        type: array
                        items:
                          type: object
                          properties:
                            containerId:
                              type: string
                            info:
                              $ref: '#/components/schemas/ContainerInfo'
                      count:
                        type: integer
                        example: 3
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/containers:
    get:
      tags:
        - Containers
      summary: 列出所有容器
      description: 获取所有 GitCode 管理的容器列表
      operationId: listAllContainers
      security:
        - GitCodeToken: []
        - BearerAuth: []
      responses:
        '200':
          description: 成功获取容器列表
