        content:
          application/json:
            schema:
              type: object
              properties:
                branch:
                  type: string
                  description: 可选的分支名称
                  example: 'main'
      responses:
        '200':
          description: 成功重置容器
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Container reset successfully'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
