        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflow/cleanup:
    delete:
      tags:
        - Workflows
      summary: 清理过期的 workflow 记录
      description: 删除旧的 workflow 执行记录，可指定最大保留时间
      operationId: cleanupWorkflows
      parameters:
        - name: maxAge
          in: query
          description: 最大保留时间（毫秒）
          schema:
            type: number
          example: 86400000
      responses:
        '200':
          description: 成功清理 workflow
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      deletedCount:
                        type: integer
                        example: 10
                      message:
                        type: string
                        example: 'Cleaned up 10 old workflow(s)'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflow/test-registry-mirror:
    post:
      tags:
        - Workflows
      summary: 测试单个 Docker 镜像源
      description: 测试指定 Docker 镜像源的可用性和速度
      operationId: testRegistryMirror
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mirror:
                  type: string
                  description: 镜像源地址（空字符串表示 Docker Hub）
                  example: 'docker.m.daocloud.io'
                mirrorName:
                  type: string
                  description: 镜像源名称（用于显示）
                  example: 'DaoCloud镜像源'
                testImage:
                  type: string
                  description: 测试用的镜像
                  example: 'alpine:latest'
      responses:
        '200':
          description: 成功测试镜像源
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/RegistryMirrorTestResult'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/workflow/test-all-registry-mirrors:
    get:
      tags:
        - Workflows
      summary: 测试所有预定义的 Docker 镜像源
      description: 并发测试所有预定义的 Docker 镜像源，返回按速度排序的结果
      operationId: testAllRegistryMirrors
      parameters:
        - name: testImage
          in: query
          description: 测试用的镜像
          schema:
            type: string
          example: 'node:22-alpine'
      responses:
        '200':
          description: 成功测试所有镜像源
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RegistryMirrorTestResult'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repos/{owner}/{repo}/workflows/logs:
    get:
      tags:
        - Workflows
      summary: 获取 workflow 历史日志列表
      description: 获取指定仓库的所有 workflow 执行日志的元数据列表
      operationId: listWorkflowLogs
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OwnerParam'
        - $ref: '#/components/parameters/RepoParam'
      responses:
        '200':
          description: 成功获取日志列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      logs:
                        type: array
                        items:
                          $ref: '#/components/schemas/WorkflowLogMeta'
                      count:
                        type: integer
                        description: 日志总数
                        example: 15
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '500':
          $ref: '#/components/responses/ServerError'

  /api/repos/{owner}/{repo}/workflows/logs/{id}:
    get:
      tags:
        - Workflows
      summary: 获取 workflow 完整数据
      description: 获取指定 workflow 的完整 WorkflowResult 对象
      operationId: getWorkflowLog
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OwnerParam'
        - $ref: '#/components/parameters/RepoParam'
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: 'owner-repo-123-1730900000000'
      responses:
        '200':
          description: 成功获取 workflow 数据
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/WorkflowResult'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Workflow 日志不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                error: 'Not Found'
                message: 'Workflow log not found'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags:
        - Workflows
      summary: 删除 workflow 日志
      description: 删除指定的 workflow 日志文件（管理操作）
      operationId: deleteWorkflowLog
      security:
        - GitCodeToken: []
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OwnerParam'
        - $ref: '#/components/parameters/RepoParam'
        - name: id
          in: path
          required: true
          description: Workflow ID
          schema:
            type: string
          example: 'owner-repo-123-1730900000000'
      responses:
        '200':
          description: 成功删除日志
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: 'Workflow log deleted successfully'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: Workflow 日志不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    GitCodeToken:
      type: apiKey
      in: header
      name: X-GitCode-Token
      description: GitCode API Token
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token
      description: GitCode API Token (使用 Bearer 格式)

  parameters:
    OwnerParam:
      name: owner
      in: path
      required: true
      description: 仓库所有者（用户名或组织名）
      schema:
        type: string
      example: username

    RepoParam:
      name: repo
      in: path
      required: true
      description: 仓库名称
      schema:
        type: string
      example: my-project

    NumberParam:
      name: number
      in: path
      required: true
      description: PR 或 Issue 编号
      schema:
        type: integer
      example: 42

    ConfigIdParam:
      name: configId
      in: path
      required: true
      description: Workflow 配置唯一 ID
      schema:
        type: string
      example: config-abc123

    ContainerIdParam:
      name: containerId
      in: path
      required: true
      description: 容器唯一 ID
      schema:
        type: string
      example: container-def456

    WorkflowIdParam:
      name: workflowId
      in: path
      required: true
      description: Workflow 执行唯一 ID
      schema:
        type: string
      example: workflow-ghi789

  schemas:
    UserProfile:
      type: object
      description: 用户详细资料
      required:
        - avatar_url
        - followers_url
        - html_url
        - id
        - login
        - name
        - type
        - url
        - followers
        - following
        - top_languages
      properties:
        avatar_url:
          type: string
          description: 用户头像 URL
          example: 'https://gitcode.com/avatars/u/123456'
        followers_url:
          type: string
          description: 关注者列表 URL
          example: 'https://gitcode.com/api/v5/users/username/followers'
        html_url:
          type: string
          description: 用户主页 URL
          example: 'https://gitcode.com/username'
        id:
          type: string
          description: 用户 ID
          example: '123456'
        login:
          type: string
          description: 用户登录名
          example: 'username'
        name:
          type: string
          description: 用户显示名称
          example: '张三'
        type:
          type: string
          description: 用户类型
          example: 'User'
        url:
          type: string
          description: 用户 API URL
          example: 'https://gitcode.com/api/v5/users/username'
        bio:
          type: string
          description: 用户简介
          example: 'Full-stack developer'
        blog:
          type: string
          description: 用户博客 URL
          example: 'https://example.com'
        company:
          type: string
          description: 用户所在公司
          example: 'Tech Corp'
        email:
          type: string
          description: 用户邮箱
          example: 'user@example.com'
        followers:
          type: integer
          description: 关注者数量
          example: 42
        following:
          type: integer
          description: 正在关注的数量
          example: 18
        top_languages:
          type: array
          description: 最常用的编程语言
          items:
            type: string
          example: ['TypeScript', 'Python', 'Go']

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 请求是否成功
          example: true
        data:
          type: object
          description: 返回的数据
          additionalProperties: true

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          description: 请求是否成功
          example: false
        error:
          type: string
          description: 错误类型
          example: Failed to fetch data
        message:
          type: string
          description: 错误详细信息
          example: Repository not found

    WorkflowConfigStep:
      type: object
      required:
        - name
        - commands
      properties:
        name:
          type: string
          description: 步骤名称
          example: 'Build'
        commands:
          type: array
          items:
            type: string
          description: 命令列表
          example: ['pnpm install', 'pnpm build']

    WorkflowConfig:
      type: object
      required:
        - configId
        - owner
        - repo
        - name
        - steps
      properties:
        configId:
          type: string
          description: 配置唯一 ID
          example: 'config-abc123'
        owner:
          type: string
          description: 仓库所有者
          example: 'username'
        repo:
          type: string
          description: 仓库名称
          example: 'my-project'
        name:
          type: string
          description: 配置名称
          example: 'Build and Test'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConfigStep'
          description: 执行步骤
        env:
          type: object
          additionalProperties:
            type: string
          description: 可选环境变量
          example:
            NODE_ENV: 'production'
        timeout:
          type: number
          description: 可选超时时间（毫秒）
          example: 600000

    CreateWorkflowConfigRequest:
      type: object
      required:
        - name
        - steps
      properties:
        name:
          type: string
          description: 配置名称
          example: 'Build and Test'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConfigStep'
          description: 执行步骤
        env:
          type: object
          additionalProperties:
            type: string
          description: 可选环境变量
        timeout:
          type: number
          description: 可选超时时间（毫秒）

    UpdateWorkflowConfigRequest:
      type: object
      properties:
        name:
          type: string
          description: 配置名称
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowConfigStep'
          description: 执行步骤
        env:
          type: object
          additionalProperties:
            type: string
          description: 可选环境变量
        timeout:
          type: number
          description: 可选超时时间（毫秒）

    ContainerInfo:
      type: object
      required:
        - containerId
        - status
        - repoUrl
      properties:
        containerId:
          type: string
          description: 容器唯一 ID
          example: 'abc123def456'
        status:
          type: string
          description: 容器状态
          enum: [running, stopped, created, exited]
          example: 'running'
        repoUrl:
          type: string
          description: 仓库 Git URL
          example: 'https://gitcode.com/username/my-project.git'
        currentBranch:
          type: string
          description: 当前分支
          example: 'main'
        currentSha:
          type: string
          description: 当前 commit SHA
          example: 'abc123def456789'
        image:
          type: string
          description: Docker 镜像
          example: 'node:22-bookworm'
        labels:
          type: object
          additionalProperties:
            type: string
          description: 容器标签

    WorkflowStep:
      type: object
      required:
        - name
        - status
      properties:
        name:
          type: string
          description: 步骤名称
          example: 'Build'
        status:
          type: string
          description: 步骤状态
          enum: [pending, running, success, failed]
          example: 'success'
        output:
          type: string
          description: 步骤输出（日志）
        startTime:
          type: string
          format: date-time
          description: 开始时间
        endTime:
          type: string
          format: date-time
          description: 结束时间

    WorkflowResult:
      type: object
      required:
        - workflowId
        - owner
        - repo
        - repoUrl
        - prNumber
        - status
        - steps
        - createdAt
      properties:
        workflowId:
          type: string
          description: Workflow 唯一标识
          example: 'workflow-ghi789'
        owner:
          type: string
          description: 仓库所有者
          example: 'username'
        repo:
          type: string
          description: 仓库名称
          example: 'my-project'
        repoUrl:
          type: string
          description: 仓库 URL
          example: 'https://gitcode.com/username/my-project'
        prNumber:
          type: integer
          description: PR 编号
          example: 42
        configId:
          type: string
          description: 配置 ID（如果使用了预定义配置）
          example: 'config-abc123'
        configName:
          type: string
          description: 配置名称（用于展示）
          example: 'Build and Test'
        status:
          type: string
          description: 整体状态
          enum: [pending, running, success, failed]
          example: 'success'
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
          description: 执行步骤列表
        createdAt:
          type: string
          format: date-time
          description: 创建时间
        completedAt:
          type: string
          format: date-time
          description: 完成时间
        error:
          type: string
          description: 错误信息

    RegistryMirrorTestResult:
      type: object
      required:
        - success
        - mirror
        - mirrorName
        - duration
      properties:
        success:
          type: boolean
          description: 是否成功
          example: true
        mirror:
          type: string
          description: 镜像源地址（空字符串表示 Docker Hub）
          example: 'docker.m.daocloud.io'
        mirrorName:
          type: string
          description: 镜像源名称（用于显示）
          example: 'DaoCloud镜像源（推荐）'
        duration:
          type: number
          description: 耗时（毫秒）
          example: 1234
        speed:
          type: number
          description: 下载速度（MB/s）
          example: 5.67
        error:
          type: string
          description: 错误信息

    WorkflowLogMeta:
      type: object
      description: Workflow 日志元数据（用于列表展示）
      required:
        - workflowId
        - owner
        - repo
        - prNumber
        - status
        - createdAt
      properties:
        workflowId:
          type: string
          description: Workflow 唯一标识
          example: 'owner-repo-123-1730900000000'
        owner:
          type: string
          description: 仓库所有者
          example: 'username'
        repo:
          type: string
          description: 仓库名称
          example: 'my-project'
        prNumber:
          type: integer
          description: PR 编号
          example: 123
        configId:
          type: string
          description: 配置 ID
          example: 'config-abc123'
        configName:
          type: string
          description: 配置名称
          example: 'Build and Test'
        status:
          type: string
          description: 执行状态
          enum: [pending, running, success, failed]
          example: 'success'
        createdAt:
          type: string
          format: date-time
          description: 创建时间
          example: '2024-11-07T00:00:00.000Z'
        completedAt:
          type: string
          format: date-time
          description: 完成时间
          example: '2024-11-07T00:05:30.000Z'
        duration:
          type: integer
          description: 执行耗时（毫秒）
          example: 330000

  responses:
    BadRequestError:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Bad Request
            message: Required field is missing

    UnauthorizedError:
      description: 未授权 - 缺少或无效的 GitCode Token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Unauthorized
            message: GitCode token is required

    NotImplementedError:
      description: 功能未实现
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Not implemented
            message: This endpoint is not implemented yet

    ServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: Internal Server Error
            message: An unexpected error occurred
